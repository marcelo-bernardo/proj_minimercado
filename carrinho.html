<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <!--=============CABEÇALHO ======================-->
    <header class="bg-success border-bottom shadow-sm">
        <div class="container py-2 d-flex align-items-center justify-content-between flex-wrap">
            <a href="index.html" class="d-flex align-items-center text-decoration-none">
                <img src="assets/img/logo.png" alt="Logo do MiniMercado" class="img-fluid me-2" style="max-height: 50px;">
                <h1 class="fs-5 fw-bold text-white mb-0">Preço Baixo</h1>
            </a>
            <!--Barra de busca de produtos-->
            <form class="d-none d-md-flex flex-grow-1 mx-4" role="search">
                <input class="form-control me-2" type="search" placeholder="Buscar produtos..."
                    aria-label="Buscar produtos">
                <button class="btn btn-light" type="submit">Buscar</button>
            </form>
    
            <div class="d-flex align-items-center gap-3 mt-2 mt-md-0">
                <a href="carrinho.html" class="btn btn-outline-light position-relative d-flex align-items-center">
                    <img src="assets/img/carrinho.png" alt="Ícone de carrinho de compras" width="20" height="20"> <span
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        2
                    </span>
                </a>
                <!--Login usuário-->
                <a href="login.html" class="btn btn-outline-light d-flex align-items-center">
                    <img src="assets/img/entrar-avatar.png" alt="Ícone de perfil de usuário para login" width="20" height="20">
                </a>
            </div>
        </div>
        <!--Links de naveção,nprodutos sobre, serviços e contatos-->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>
        
                <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                    <ul class="navbar-nav nav-pills">
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html#produtos-destaque" onclick="ativar(this)">Produtos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre.html" onclick="ativar(this)">Sobre</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#servicos" onclick="ativar(this)">Serviços</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#contatos" onclick="ativar(this)">Contatos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    <!--=============Corpo, contém seções de produtos, serviços e fomulario de 
    cadatastro ======================-->
    <main class="container my-5">
        <h2 class="mb-4 text-white">Carrinho de Compras</h2>

        <section aria-label="Itens no carrinho">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Item</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-produto-id="1">
                            <td>Água Sanitária Super Candida 5lt</td>
                            <td>R$ 9,99</td>
                            <td>
                                <input type="number" class="form-control" name="quantidade" value="1" min="1"
                                    aria-label="Quantidade de Água Sanitária" />
                            </td>
                            <td>
                                <button class="btn btn-danger btn-sm" aria-label="Remover item">Remover</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="mt-4" aria-label="Resumo do pedido">
            <div class="d-flex justify-content-between align-items-center">
                <p class="h5 text-white"><strong>Total:</strong> <span id="valor-total">R$ 9,99</span></p>
                <button class="btn btn-primary">Finalizar Compra</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
