<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimercado Preço Baixo</title>
    <link rel="shortcut icon" href="assets/img/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
</head>

<body class="d-flex justify-content-center align-items-center vh-100 text-light" style="background-color:#22711960;">
    <div class="card p-4 text-center"
        style="width: 100%; max-width: 400px; background-color: #2F2F2F; color: #DCDCDC; ">
        <form action="" method="post">
            <img src="assets/img/logo.png" alt="Logo do MiniMercado" width="80" height="80" title="&copy; MiniMercado" />
            <h3 class="mb-4 mt-3" style="font-weight: 700; word-spacing: 10px; letter-spacing: 3px;">Login</h3>
            <div class="mb-3 text-start">
                <input type="text" name="user" class="form-control" placeholder="Digite usuário" required
                    maxlength="80" />
            </div>
            <div class="mb-3 text-start">
                <input type="password" name="password" class="form-control" placeholder="Digite sua senha" required
                    maxlength="45" />
            </div>
            <input type="submit" value="Entrar" class="btn btn-primary w-100 mb-2" />
            <div class="mt-2">
                <small class="text-light">Primeiro acesso?</small><br />
                <a href="/paginas/nova_conta.html" class="btn btn-outline-light btn-sm mt-1 w-100">
                    Criar conta
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
        integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
        crossorigin="anonymous"></script>
</body>

</html>
